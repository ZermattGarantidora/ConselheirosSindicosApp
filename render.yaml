services:
  - type: web
    name: alvitra-demo-sintetica
    runtime: node
    region: oregon
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:api && pnpm run build:web
    startCommand: node dist/api/app/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_SEED_DOCUMENTS
        value: "false"
      - key: WEB_DIST_DIR
        value: apps/web/dist
