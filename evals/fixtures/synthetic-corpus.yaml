schema_version: 1
notice: >-
  Corpus inteiramente fictício para testes. Não descreve regras reais e não deve ser usado como orientação jurídica ou operacional.

users:
  - id: user_multi
    memberships:
      - condominium_id: condo_alameda
        role: manager
      - condominium_id: condo_bosque
        role: manager
  - id: user_alameda
    memberships:
      - condominium_id: condo_alameda
        role: manager

condominiums:
