        valid_to: null
        extraction_quality: 0.41
        pages:
          - page: 2
            text: >-
              Vig3ncia possivelmente até 3l/1O/2O26. Trecho com reconhecimento incerto e caracteres ambíguos.

  - id: alameda_untrusted_note
    condominium_id: condo_alameda
