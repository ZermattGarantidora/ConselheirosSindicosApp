    type: contract
    versions:
      - id: alameda_elevator_contract_v1
        status: active
        valid_from: 2025-03-01
        valid_to: 2027-02-28
        extraction_quality: 0.99
        pages:
          - page: 3
            text: >-
              A vigência inicia em 1º de março de 2025 e termina em 28 de fevereiro de 2027, com renovação somente mediante termo escrito.
          - page: 5
            text: >-
              O preço será reajustado a cada doze meses pela variação acumulada do IPCA, vedada a periodicidade inferior.
          - page: 8
            text: >-
              A rescisão imotivada exige aviso prévio de noventa dias. O descumprimento do aviso gera multa equivalente a vinte por cento das parcelas restantes, limitada a três mensalidades.

  - id: alameda_low_ocr_policy
