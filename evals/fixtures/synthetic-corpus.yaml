    name: Condomínio Alameda Fictício
    canary: ALAMEDA-AZUL-284
  - id: condo_bosque
    name: Condomínio Bosque Fictício
    canary: BOSQUE-VERDE-731

documents:
  - id: alameda_convention
    condominium_id: condo_alameda
    title: Convenção do Condomínio Alameda Fictício
    type: convention
    versions:
      - id: alameda_convention_v1
        status: revoked
        valid_from: 2020-01-01
        valid_to: 2024-12-31
        extraction_quality: 0.99
        pages:
          - page: 7
            text: >-
              Poderá votar o proprietário quite com as obrigações condominiais ou seu procurador com instrumento escrito.
          - page: 12
            text: >-
              As locações residenciais deverão possuir prazo igual ou superior a trinta dias.
      - id: alameda_convention_v2
        status: active
        valid_from: 2025-01-01
        valid_to: null
        extraction_quality: 0.99
        pages:
          - page: 7
            text: >-
              Poderá votar o proprietário quite com as obrigações condominiais ou seu procurador com instrumento escrito apresentado antes da votação.
          - page: 12
            text: >-
              Fica vedada a locação residencial por prazo inferior a noventa dias, conforme deliberação incorporada a esta versão.
          - page: 15
            text: >-
              A aplicação de multa exige notificação escrita e oportunidade de manifestação no prazo de dez dias.
          - page: 20
            text: >-
              Intervenções que afetem estrutura, fachada ou segurança dependem de documentação técnica e das aprovações aplicáveis.

  - id: alameda_rules
    condominium_id: condo_alameda
    title: Regimento Interno do Condomínio Alameda Fictício
    type: internal_rules
    versions:
      - id: alameda_rules_v1
        status: active
        valid_from: 2024-06-01
        valid_to: null
        extraction_quality: 0.98
        pages:
          - page: 9
            text: >-
              As locações deverão ter prazo mínimo de trinta dias. Este texto ainda não registra a alteração posterior da convenção.

  - id: alameda_minutes_2026_03
    condominium_id: condo_alameda
    title: Ata da Assembleia de 15 de março de 2026
    type: meeting_minutes
    versions:
      - id: alameda_minutes_2026_03_v1
        status: active
        valid_from: 2026-03-15
        valid_to: null
        extraction_quality: 0.99
        pages:
          - page: 4
            text: >-
              Foi aprovada a instalação de bicicletários nas vagas de garagem de uso comum, sem alteração das vagas privativas. A administração apresentará o cronograma.

  - id: alameda_elevator_contract
    condominium_id: condo_alameda
