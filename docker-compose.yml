services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: conselheiro
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conselheiro"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/database:/migrations:ro

volumes:
  postgres_data:
