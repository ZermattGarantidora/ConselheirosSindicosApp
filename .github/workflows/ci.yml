name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm run check

      - name: Run synthetic evals
        run: pnpm run evals:synthetic

      - name: Run documentary evals
        run: pnpm run evals:documentary

      - name: Prepare authoring homologation with synthetic contracts
        run: pnpm run evals:authoring:homologation

      - name: Lint authoring homologation instruments
        run: pnpm exec eslint --no-ignore evals/authoring-homologation

      - name: Upload authoring homologation review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-homologation-${{ github.sha }}
          path: |
            reports/authoring-homologation-synthetic.json
            reports/authoring-homologation-reviewer-packet.json
            reports/authoring-homologation-review-form.template.json
            reports/authoring-homologation.junit.xml
          if-no-files-found: error

      - name: Check synthetic semantic replay contracts
        run: pnpm run evals:documentary:semantic --synthetic

      - name: Check conversation replay contracts
        run: pnpm run evals:conversations --synthetic

      - name: Upload conversation review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-review-${{ github.sha }}
          path: reports/conversations-synthetic.json
          if-no-files-found: error

      - name: Upload synthetic review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-review-${{ github.sha }}
          path: reports/documentary-semantic-synthetic.json
          if-no-files-found: error

      - name: Run end-to-end tests
        run: pnpm run test:e2e

      - name: Build web client
        run: pnpm run build:web

      - name: Build production API
        run: pnpm run build:api

      - name: Verify compiled production runtime
        run: pnpm run test:production

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
